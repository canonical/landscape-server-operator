description: Landscape Scalable Dev with internal HAProxy
model-config:
  image-stream: daily
applications:
  postgresql:
    channel: 16/stable
    charm: ch:postgresql
    num_units: 1
    options:
      plugin_plpython3u_enable: true
      plugin_ltree_enable: true
      plugin_intarray_enable: true
      plugin_debversion_enable: true
      plugin_pg_trgm_enable: true
      experimental_max_connections: 500
    base: ubuntu@24.04
  rabbitmq-server:
    channel: latest/edge
    charm: ch:rabbitmq-server
    num_units: 1
    options:
      consumer-timeout: 259200000
  landscape-server:
    charm: ../landscape-server_ubuntu@26.04-amd64.charm
    num_units: 1
    options:
      landscape_ppa: "ppa:jansdhillon/test21,ppa:landscape/self-hosted-beta,ppa:canonical-python-maintainers/python-backports"
      min_install: true
      enable_hostagent_messenger: true
      enable_ubuntu_installer_attach: false
      root_url: "https://landscape-server-jammy.com/"
      additional_service_config: |
        [appserver]
        openid_provider_url = https://login.ubuntu.com/
        openid_logout_url = https://login.ubuntu.com/+logout
        ubuntu_one_redirect_url = https://landscape-server-jammy.com/new_dashboard/handle-auth/ubuntu-one/
        oidc_issuer = https://integrator-9417358.okta.com/
        oidc_client_id = 0oawiqe4b0fhVZT3c697
        oidc_client_secret = mMqpBNQ61aYgUSMcOnnexvO8xLg01bnP_CQHpSTT-8JNd7GtAw4ZLRzp9Ir2_83E
    base: ubuntu@26.04
  lb-certs:
    charm: self-signed-certificates
    channel: stable
    num_units: 1
    constraints: arch=amd64

relations:
  - [landscape-server:inbound-amqp, rabbitmq-server]
  - [landscape-server:outbound-amqp, rabbitmq-server]
  - [landscape-server:database, postgresql:database]
  - [landscape-server:load-balancer-certificates, lb-certs:certificates]
