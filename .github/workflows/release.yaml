# Copyright 2026 Canonical Ltd.
name: Release `main` to `26.04/edge` channel on Charmhub

on:
    push:
        branches:
            - main

        paths-ignore:
            - "tests/**"
            - "pyproject.toml"
            - ".github/workflows/*.yaml"

jobs:
    lint:
        name: Lint
        uses: ./.github/workflows/lint.yaml
        secrets: inherit

    test:
        name: Unit tests
        uses: ./.github/workflows/unit-test.yaml
        secrets: inherit

    build:
        name: Build charm
        uses: ./.github/workflows/build.yaml
        permissions:
            actions: read # Needed to manage the artifact cache (used by build_charm.yaml from data-platform-workflows)
            contents: read

    release:
        name: Release charm
        needs:
            - lint
            - test
            - build

        uses: canonical/data-platform-workflows/.github/workflows/release_charm_edge.yaml@v35.0.2
        with:
            track: "26.04"
            artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}

        secrets:
            charmhub-token: ${{ secrets.CHARMHUB_TOKEN }}

        permissions:
            contents: write # Needed to create git tags (created by release_charm_edge.yaml)
