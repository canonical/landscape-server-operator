description: Landscape scalable integration testing
model-config:
  image-stream: daily
applications:
  postgresql:
    channel: 16/stable
    charm: ch:postgresql
    base: ubuntu@24.04
    num_units: 1
    options:
      plugin_plpython3u_enable: true
      plugin_ltree_enable: true
      plugin_intarray_enable: true
      plugin_debversion_enable: true
      plugin_pg_trgm_enable: true
      experimental_max_connections: 500
  rabbitmq-server:
    channel: latest/edge
    charm: ch:rabbitmq-server
    num_units: 1
    options:
      consumer-timeout: 259200000
  landscape-server:
    charm: ../../landscape-server_ubuntu@26.04-amd64.charm
    num_units: 2
    base: ubuntu@24.04
    options:
      landscape_ppa: "ppa:jansdhillon/test21,ppa:landscape/self-hosted-beta,ppa:canonical-python-maintainers/python-backports"
      min_install: true
      enable_hostagent_messenger: true
      enable_ubuntu_installer_attach: false
      root_url: "https://landscape-server-jammy.com/"
      additional_service_config: |
        [appserver]
        openid_provider_url = https://login.ubuntu.com/
        openid_logout_url = https://login.ubuntu.com/+logout
        ubuntu_one_redirect_url = https://landscape-server-jammy.com/new_dashboard/handle-auth/ubuntu-one/
        oidc_issuer = https://integrator-9417358.okta.com/
        oidc_client_id = 0oawiqe4b0fhVZT3c697
        oidc_client_secret = mMqpBNQ61aYgUSMcOnnexvO8xLg01bnP_CQHpSTT-8JNd7GtAw4ZLRzp9Ir2_83E
    base: ubuntu@26.04
  haproxy:
    charm: ch:haproxy
    channel: 2.8/edge
    num_units: 1
  self-signed-certificates:
    charm: ch:self-signed-certificates
    channel: 1/stable
    num_units: 1
relations:
  - [landscape-server:inbound-amqp, rabbitmq-server]
  - [landscape-server:outbound-amqp, rabbitmq-server]
  - [landscape-server:database, postgresql:database]
  - [haproxy:certificates, self-signed-certificates:certificates]
  - [haproxy:receive-ca-certs, self-signed-certificates:send-ca-cert]
  - [landscape-server:appserver-haproxy-route, haproxy:haproxy-route]
  - [landscape-server:pingserver-haproxy-route, haproxy:haproxy-route]
  - [landscape-server:message-server-haproxy-route, haproxy:haproxy-route]
  - [landscape-server:api-haproxy-route, haproxy:haproxy-route]
  - [landscape-server:package-upload-haproxy-route, haproxy:haproxy-route]
  - [landscape-server:hostagent-messenger-haproxy-route, haproxy:haproxy-route]
  - [landscape-server:ubuntu-installer-attach-haproxy-route, haproxy:haproxy-route]
